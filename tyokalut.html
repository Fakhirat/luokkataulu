<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Luokan työkalut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="common.js"></script>
<style>
/* Layout: one tool at a time filling the window, tool tabs on top. Works on its own (no keys), e.g. linked from Miro or opened on any screen. */
:root{
  --bg:#f6f1e7; --panel:#fffdf8; --ink:#1f2933; --muted:#6c6a63; --line:#e7dfcf;
  --accent:#e2582b; --accent-ink:#ffffff; --teal:#1f7a85; --danger:#b4321d; --ok:#2f8a4e; --warn:#d18b00;
  --s4:#cdeec9; --s6:#c6ece6; --chip-ink:#1f2933;
  --display:"Fredoka","Segoe UI",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13171c; --panel:#1b2128; --ink:#eef0ea; --muted:#9aa3a8; --line:#2c343d;
  --accent:#ff8a5c; --accent-ink:#1b1410; --teal:#5cc2cc; --danger:#ff8c78; --ok:#6fd08f; --warn:#f2bb4a;
  --s4:#a9d6a3; --s6:#9fd6cc; --chip-ink:#13171c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13171c; --panel:#1b2128; --ink:#eef0ea; --muted:#9aa3a8; --line:#2c343d;
  --accent:#ff8a5c; --accent-ink:#1b1410; --teal:#5cc2cc; --danger:#ff8c78; --ok:#6fd08f; --warn:#f2bb4a;
  --s4:#a9d6a3; --s6:#9fd6cc; --chip-ink:#13171c; color-scheme:dark;}
*{box-sizing:border-box}
html{font-size:clamp(12px,1vw,24px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.2rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:1rem;padding-block:1rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:1rem;padding:.55rem 1.1rem;font-family:var(--display);font-weight:600;font-size:1.4rem;min-height:3.2rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sp{flex:1}
#stage{overflow:auto}
.overlay{position:fixed;inset:0;background:rgba(15,20,25,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.sheet{background:var(--panel);border-radius:16px;width:min(480px,100%);padding:20px;display:flex;flex-direction:column;gap:12px;font-size:16px}
.sheet h3{font-family:var(--display);font-size:22px;margin:0}
.sheet p{margin:0;color:var(--muted);line-height:1.45}
.sheet textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:220px;width:100%}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.sheet button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:10px 16px;min-height:44px}
.sheet button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
@media (max-width:700px){html{font-size:13px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="lt-stage" id="stage"></div>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nmH">
  <h3 id="nmH">Oppilaiden nimet</h3>
  <p>Kirjoita etunimet, yksi per rivi. Nimet tallentuvat vain tähän selaimeen.</p>
  <textarea id="names" aria-label="Oppilaiden nimet"></textarea>
  <div class="row"><button type="button" id="nmCancel">Peruuta</button><button type="button" class="primary" id="nmSave">Tallenna</button></div>
</div></div>
<script src="tools.js"></script>
<script>
(function(){
"use strict";
var L=LT;
var HASH={timer:"ajastin",noise:"aanitaso",draw:"arvonta",groups:"ryhmat",calm:"rauhoitu",move:"taukojumppa"};
function names(){try{return JSON.parse(L.lsGet("lt-tool-names","[]"));}catch(e){return [];}}
function editNames(){var o=document.getElementById("overlay");document.getElementById("names").value=names().join("\n");o.hidden=false;document.getElementById("names").focus();}
document.getElementById("nmCancel").onclick=function(){document.getElementById("overlay").hidden=true;};
document.getElementById("nmSave").onclick=function(){
  var seen={},list=document.getElementById("names").value.split(/\r?\n/).map(function(s){return s.trim().slice(0,24);}).filter(function(s){if(!s||seen[s])return false;seen[s]=1;return true;});
  L.lsSet("lt-tool-names",JSON.stringify(list));document.getElementById("overlay").hidden=true;show(cur);
};
LTT.setup({students:names,editNames:editNames,noStudentsText:"Lisää oppilaiden etunimet, niin arvonta ja ryhmät toimivat. Nimet tallentuvat vain tähän selaimeen."});
var cur="timer",tabs=document.getElementById("tabs");
tabs.innerHTML=LTT.TOOLS.map(function(t){return '<button class="tab" role="tab" type="button" data-t="'+t[0]+'">'+t[1]+' '+t[2]+'</button>';}).join("");
tabs.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){location.hash=HASH[b.dataset.t];show(b.dataset.t);};});
function show(id){cur=id;tabs.querySelectorAll("[data-t]").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.t===id));});LTT.render(id,document.getElementById("stage"));}
function fromHash(){var h=location.hash.slice(1);for(var k in HASH)if(HASH[k]===h)return k;return "timer";}
window.addEventListener("hashchange",function(){var t=fromHash();if(t!==cur)show(t);});
show(fromHash());
})();
</script>
</body>
</html>
